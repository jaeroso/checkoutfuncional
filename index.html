<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout de Compra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="checkout">

        <h1>Checkout de Compra</h1>

        <div class="campo">
            <label for="produto">Preço do Produto (R$):</label>
            <input
                type="number"
                id="produto"
                placeholder="Ex: 100.00"
                step="0.01"
            >
        </div>

        <div class="campo">
            <label for="frete">Valor do Frete (R$):</label>
            <input
                type="number"
                id="frete"
                placeholder="Ex: 15.00"
                step="0.01"
            >
        </div>

        <div class="pagamento">
            <label>Forma de Pagamento:</label>
        </div>

        <div class="botoes">
            <button class="pix" onclick="calcular('PIX')">
                PIX (-10%)
            </button>

            <button class="dinheiro" onclick="calcular('Dinheiro')">
                Dinheiro (-5%)
            </button>

            <button class="cartao" onclick="calcular('Cartão à vista')">
                Cartão à vista
            </button>

            <button class="parcelado" onclick="calcular('Parcelado')">
                Parcelado (+5%)
            </button>
        </div>

        <div class="resultado">
            <div class="forma" id="forma">
                Forma: -
            </div>

            <div class="total" id="total">
                Total: R$ 0.00
            </div>
        </div>

    </div>

</body>
</html>
